name: MagisCore
options:
  bundleIdPrefix: com.magiscore
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: MagisCore/Info.plist
    DEVELOPMENT_TEAM: ""

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    majorVersion: 7.0.0

targets:
  MagisCore:
    type: application
    platform: iOS
    sources:
      - MagisCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magiscore.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: "-ObjC"
        EAGER_LINKING: YES
        COMPILATION_CACHE_ENABLE_CACHING: YES
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
        product: GoogleSignIn
    resources:
      - path: MagisCore/Resources/Fonts
        includes: "*.ttf"
      - path: MagisCore/Data/Questions
        includes: "*.json"
      - path: MagisCore/GoogleService-Info.plist

  MagisCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: MagisCore
